name: Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --build-cache

      - name: Run 45 appium tests
        run: |
          mkdir -p reports/junit
          JEST_JUNIT_OUTPUT_DIR=reports/junit JEST_JUNIT_OUTPUT_NAME=unit-tests.xml npm run test:unit

      - name: Write test summary
        if: always()
        run: |
          node -e "const fs=require('fs'); const xml=fs.readFileSync('reports/junit/unit-tests.xml','utf8'); const attrs=Object.fromEntries([...xml.matchAll(/(tests|failures|errors|skipped)=\"(\d+)\"/g)].map(([,k,v])=>[k,v])); const total=Number(attrs.tests||0), failed=Number(attrs.failures||0)+Number(attrs.errors||0), skipped=Number(attrs.skipped||0), passed=total-failed-skipped; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Test Summary\n\n| Passed | Failed | Skipped | Total |\n| ---: | ---: | ---: | ---: |\n| '+passed+' | '+failed+' | '+skipped+' | '+total+' |\n');"
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/junit/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk